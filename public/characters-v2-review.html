<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三國夢 · 新版人物圖鑑</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#211711;color:#ffedc8;font-family:system-ui,sans-serif}header{padding:28px 5vw;background:#421b16;border-bottom:3px solid #bd9459}h1{margin:0 0 8px;font-size:30px}p{margin:7px 0;color:#d8c1a0;line-height:1.7}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-top:18px}input,button,a{font:inherit}input{padding:10px 14px;background:#fff3d8;border:0;border-radius:5px;min-width:220px}button{padding:9px 15px;border:1px solid #d0aa68;background:#6a3625;color:#fff0ce;border-radius:5px;cursor:pointer}button[aria-pressed=true]{background:#bb8644;color:#211711}#count{margin-left:auto;align-self:center}.grid{padding:26px 4vw;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}article{border:2px solid #a37a46;border-radius:12px;overflow:hidden;background:linear-gradient(145deg,#66513a,#38271e);box-shadow:0 5px 0 #140e0a}article[hidden]{display:none}h2{margin:0;padding:12px 15px;background:#421b16;border-bottom:1px solid #a37a46;font-size:20px;display:flex;justify-content:space-between;align-items:center}h2 small{font-size:11px;color:#ceb38b;font-weight:normal}.stage{height:370px;padding:10px;display:grid;place-items:center;background:radial-gradient(ellipse at center,#ae956c70,transparent 68%)}canvas{max-width:100%;max-height:100%;object-fit:contain}.portrait .stage{height:250px}footer{padding:10px 15px;background:#2d2018;font-size:12px;display:flex;justify-content:space-between}a{color:#edc17b}.note{padding:0 5vw 24px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffe195;outline-offset:3px}
canvas{width:100%;height:350px;min-width:0;min-height:0}.portrait canvas{height:230px}
</style></head><body>
<header><h1>三國夢 · 新版人物圖鑑</h1><p>28 位人物重繪提案 · 飽滿大頭／鮮明眉眼／暖色賽璐璐</p><p>右側配置已記錄為「當前行動共同參與者」，同區標示事件與委託。正式遊戲已套用本批人物與新版行動配置。</p><div class="toolbar"><input id="search" type="search" aria-label="搜尋人物" placeholder="搜尋人物姓名"><button id="full" aria-pressed="true">完整立繪</button><button id="face" aria-pressed="false">頭像試框</button><span id="count">載入中</span></div></header>
<main id="grid" class="grid"></main><p class="note">頭像試框供比較眉眼辨識度，正式接入時可逐人調整。原圖沿用洋紅底約定，本頁即時去背呈現。</p>
<script type="module">
const roster=[{"id":"caocao","name":"曹操"},{"id":"zhangliao","name":"張遼"},{"id":"yujin","name":"于禁"},{"id":"xiahoudun","name":"夏侯惇"},{"id":"dianwei","name":"典韋"},{"id":"lejin","name":"樂進"},{"id":"guojia","name":"郭嘉"},{"id":"jiaxu","name":"賈詡"},{"id":"chengyu","name":"程昱"},{"id":"xunyu","name":"荀彧"},{"id":"chenqun","name":"陳群"},{"id":"maojie","name":"毛玠"},{"id":"huangfusong","name":"皇甫嵩"},{"id":"simayi","name":"司馬懿"},{"id":"bocai","name":"波才"},{"id":"zhangliang","name":"張梁"},{"id":"zhangjiao","name":"張角"},{"id":"huaxiong","name":"華雄"},{"id":"lijue","name":"李傕"},{"id":"lvbu","name":"呂布"},{"id":"yanliang","name":"顏良"},{"id":"guotu","name":"郭圖"},{"id":"yuanshao","name":"袁紹"},{"id":"yuantan","name":"袁譚"},{"id":"shenpei","name":"審配"},{"id":"tadun","name":"蹋頓"},{"id":"lord","name":"主將"},{"id":"npc_soldier","name":"軍吏"}];const grid=document.querySelector('#grid'),count=document.querySelector('#count');let portrait=false,loaded=0;
const entries=roster.map(({id,name})=>{const card=document.createElement('article');card.dataset.name=name;card.innerHTML='<h2>'+name+'<small>'+id+'</small></h2><div class="stage"><canvas role="img" aria-label="'+name+'"></canvas></div><footer><span class="status">載入中</span><a href="./art/characters-v2/'+id+'.png" target="_blank">檢視原圖 ↗</a></footer>';grid.append(card);return{id,name,card,canvas:card.querySelector('canvas'),source:null};});
function draw(entry){if(!entry.source)return;const src=entry.source,c=entry.canvas,ctx=c.getContext('2d');if(portrait){const size=Math.round(src.width*.76),x=(src.width-size)/2,y=src.height*.14;c.width=420;c.height=420;ctx.drawImage(src,x,y,size,size,0,0,420,420);}else{c.width=src.width;c.height=src.height;ctx.drawImage(src,0,0);}}
for(const e of entries){const im=new Image();im.onload=()=>{const src=document.createElement('canvas');src.width=Math.round(im.width*Math.min(1,768/im.height));src.height=Math.min(768,im.height);const ctx=src.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0,src.width,src.height);const pixels=ctx.getImageData(0,0,src.width,src.height),d=pixels.data;for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];if(r>100&&b>100&&g<Math.min(r,b)*.65)d[i+3]=Math.round(d[i+3]*Math.max(0,Math.min(1,(g/Math.min(r,b)-.15)/.5)));}ctx.putImageData(pixels,0,0);e.source=src;draw(e);e.card.querySelector('.status').textContent='新版立繪';loaded++;count.textContent=loaded+' / 28 已載入';};im.onerror=()=>{e.card.querySelector('.status').textContent='尚未完成';};im.src='./art/characters-v2/'+e.id+'.png';}
function mode(value){portrait=value;grid.classList.toggle('portrait',value);document.querySelector('#full').setAttribute('aria-pressed',String(!value));document.querySelector('#face').setAttribute('aria-pressed',String(value));entries.forEach(draw);}
document.querySelector('#full').onclick=()=>mode(false);document.querySelector('#face').onclick=()=>mode(true);document.querySelector('#search').oninput=e=>entries.forEach(x=>x.card.hidden=!x.name.includes(e.target.value.trim()));
</script></body></html>
